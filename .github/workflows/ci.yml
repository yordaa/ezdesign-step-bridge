name: CI

on:
  pull_request:

jobs:
  build:
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
    strategy:
      matrix:
        include:
          - os: macos-15
            triplet: arm64-osx-dynamic
          - os: windows-2022
            triplet: x64-windows-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare vcpkg cache directories
        run: cmake -E make_directory .vcpkg-binary-cache
      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            .vcpkg-binary-cache
          key: ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-v2-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-v2-
      - uses: lukka/run-vcpkg@v11
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/triplets
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/vcpkg_installed/${{ matrix.triplet }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Install
        run: cmake --install build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Inspect macOS runtime dependencies
        if: runner.os == 'macOS'
        run: otool -L build/vcpkg_installed/${{ matrix.triplet }}/bin/ezd2step | grep libTKDESTEP
      - name: Inspect Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $dependencies = & $dumpbin /dependents "build\vcpkg_installed\${{ matrix.triplet }}\bin\ezd2step.exe"
          if (-not ($dependencies -match "TKDESTEP.*\.dll")) { throw "ezd2step is not dynamically linked to TKDESTEP" }
          $dependencies
