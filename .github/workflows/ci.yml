name: CI

on:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            triplet: arm64-osx-dynamic
          - os: windows-2022
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare vcpkg cache directories
        run: cmake -E make_directory .vcpkg-binary-cache build/vcpkg_installed
      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            .vcpkg-binary-cache
            build/vcpkg_installed
          key: ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-${{ hashFiles('vcpkg.json', 'triplets/**') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-
      - uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/triplets
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
