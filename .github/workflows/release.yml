name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: macos-15
            triplet: arm64-osx-dynamic
            artifact: ezd2step-macos-arm64
          - os: windows-2022
            triplet: x64-windows
            artifact: ezd2step-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(ezd2step VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME"
      - uses: lukka/run-vcpkg@v11
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/triplets
          -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Bundle
        run: cmake --build build --config Release --target package_ezd2step_bundle
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bundles/ezd2step-*

  publish:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/bundles
          merge-multiple: true
      - name: Package source and checksums
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          git archive --prefix="ezd2step-$version/" \
            -o "build/bundles/ezd2step-$version-source.tar.gz" HEAD
          scripts/create_checksums.sh build/bundles
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes build/bundles/*
